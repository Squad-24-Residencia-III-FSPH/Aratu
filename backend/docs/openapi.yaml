openapi: 3.0.3
info:
  title: Aratu API
  version: 1.0.0
  description: |
    API REST do **Aratu — Sistema de Gestão de Frota e Operações** (Squad 24 / FSPH / SVO).

    ## Autenticação
    1. Envie `email` e `senha` para `POST /auth/login`.
    2. Copie o `token` retornado.
    3. Clique em **Authorize** e informe o token no esquema `bearerAuth`.
    4. As rotas protegidas exigem o cabeçalho `Authorization: Bearer <token>`.

    ## Perfis RBAC
    Os perfis canônicos são `ADMINISTRADOR`, `GESTOR`, `SOLICITANTE`,
    `MOTORISTA`, `ATENDENTE_SVO` e `EQUIPE_SVO`. Cada endpoint indica os
    perfis autorizados na descrição da operação.

    ## Desenvolvimento
    Esta interface é servida em `/docs` somente quando `NODE_ENV` não é
    `production`. O contrato bruto está disponível em `/docs/openapi.json`.

    ## Proteção de dados (LGPD)
    Todos os exemplos usam dados fictícios. Nunca utilize dados reais de
    servidores, motoristas ou falecidos atendidos pelo SVO.
  license:
    name: Uso interno — FSPH / SVO
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: Sistema
    description: Verificação básica de disponibilidade da API.
  - name: Autenticação
    description: Login e encerramento de sessão.
  - name: Perfis
    description: Consulta dos perfis RBAC cadastrados.
  - name: Veículos
    description: Cadastro, consulta e mudança de situação de veículos da frota.
security:
  - bearerAuth: []
paths:
  /:
    get:
      tags:
        - Sistema
      operationId: getHealth
      summary: Verifica se a API está no ar
      security: []
      responses:
        '200':
          description: API disponível.
          content:
            application/json:
              schema:
                type: object
                required:
                  - mensagem
                properties:
                  mensagem:
                    type: string
                    example: Servidor Express rodando com sucesso no Docker!
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
        - Autenticação
      operationId: login
      summary: Autentica e emite token JWT
      description: |
        Valida e-mail e senha, bloqueia contas inativas e registra o evento na
        auditoria. A mensagem de erro para credenciais inválidas é idêntica
        para usuário inexistente e senha incorreta, evitando enumeração de contas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.test
              senha: senha-ficticia-123
      responses:
        '200':
          description: Autenticação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.exemplo.ficticio
                nome: Administrador de Teste
                perfil: ADMINISTRADOR
        '400':
          description: Corpo sem e-mail ou senha válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                erro: Informe um e-mail e uma senha válidos.
        '401':
          description: Credenciais incorretas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                erro: E-mail ou senha inválidos
        '403':
          description: Conta desativada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                erro: Acesso desativado
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Autenticação
      operationId: logout
      summary: Registra o encerramento da sessão
      description: |
        Registra o logout na trilha de auditoria. O cliente deve apagar o token
        armazenado; o backend não mantém uma lista de tokens revogados.
      responses:
        '200':
          description: Logout registrado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - mensagem
                properties:
                  mensagem:
                    type: string
                    example: Logout realizado. Apague o token armazenado no cliente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /profiles:
    get:
      tags:
        - Perfis
      operationId: listProfiles
      summary: Lista os perfis RBAC
      description: Exclusivo para o perfil `ADMINISTRADOR`.
      responses:
        '200':
          description: Perfis cadastrados, ordenados pelo identificador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
              example:
                - id: '1'
                  name: ADMINISTRADOR
                  description: Acesso global de parametrização e administração do sistema
                  createdAt: '2026-10-20T12:00:00.000Z'
                - id: '2'
                  name: GESTOR
                  description: Gestão operacional de frotas, condutores e aprovação de viagens FSPH
                  createdAt: '2026-10-20T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /vehicles:
    get:
      tags:
        - Veículos
      operationId: listVehicles
      summary: Lista veículos com filtros opcionais
      description: Permitido para `GESTOR`, `ADMINISTRADOR` e `ATENDENTE_SVO`.
      parameters:
        - name: status
          in: query
          required: false
          description: Situação vigente do veículo.
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: category
          in: query
          required: false
          description: Categoria operacional do veículo.
          schema:
            $ref: '#/components/schemas/VehicleCategory'
        - name: operationType
          in: query
          required: false
          description: Operação atendida pelo veículo.
          schema:
            $ref: '#/components/schemas/VehicleOperationType'
      responses:
        '200':
          description: Lista de veículos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
              example:
                - id: '1'
                  licensePlate: ABC1D23
                  categories:
                    - PASSENGER
                  seats: 5
                  bodyLimit: 2
                  weightLimit: 450.5
                  operationType: ADMINISTRATIVE
                  status: AVAILABLE
                  revision: 1
                  createdAt: '2026-10-20T12:00:00.000Z'
                  updatedAt: '2026-10-20T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Veículos
      operationId: createVehicle
      summary: Cadastra um veículo
      description: |
        Permitido para `GESTOR` e `ADMINISTRADOR`. A placa é normalizada para
        maiúsculas e aceita os formatos `ABC1234` ou `ABC1D23`. O cadastro
        grava, na mesma transação, o evento inicial e a auditoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleInput'
            example:
              licensePlate: ABC1D23
              categories:
                - PASSENGER
              seats: 5
              bodyLimit: 2
              weightLimit: 450.5
              operationType: ADMINISTRATIVE
              reportedBy: Maria Teste
              reason: Cadastro inicial para testes
      responses:
        '201':
          description: Veículo cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Placa já cadastrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                erro: Placa já cadastrada
        '500':
          $ref: '#/components/responses/InternalError'
  /vehicles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico do veículo.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
          example: '1'
    get:
      tags:
        - Veículos
      operationId: getVehicleById
      summary: Consulta um veículo pelo identificador
      description: Permitido para `GESTOR`, `ADMINISTRADOR` e `ATENDENTE_SVO`.
      responses:
        '200':
          description: Veículo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Veículos
      operationId: updateVehicle
      summary: Atualiza os dados de um veículo
      description: |
        Permitido para `GESTOR` e `ADMINISTRADOR`. Exige `expectedRevision`
        para controle de concorrência otimista. A alteração grava histórico e
        auditoria na mesma transação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleInput'
            example:
              licensePlate: ABC1D23
              categories:
                - PASSENGER
                - BODY
              seats: 6
              bodyLimit: 3
              weightLimit: null
              operationType: SVO
              expectedRevision: 1
              reportedBy: Maria Teste
              reason: Ajuste fictício de capacidade
      responses:
        '200':
          description: Veículo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /vehicles/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico do veículo.
        schema:
          type: string
          pattern: '^[1-9][0-9]*$'
          example: '1'
    patch:
      tags:
        - Veículos
      operationId: changeVehicleStatus
      summary: Altera a situação de um veículo
      description: |
        Permitido para `GESTOR` e `ADMINISTRADOR`. A máquina de estados permite
        `AVAILABLE` → `IN_MAINTENANCE`/`INACTIVE`, `IN_MAINTENANCE` →
        `AVAILABLE`/`INACTIVE` e `INACTIVE` → `AVAILABLE`. Exige
        `expectedRevision` e registra histórico/auditoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeVehicleStatusInput'
            example:
              status: IN_MAINTENANCE
              expectedRevision: 1
              reportedBy: Maria Teste
              reason: Manutenção preventiva fictícia
      responses:
        '200':
          description: Situação alterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT retornado por `POST /auth/login` (HS256).
  responses:
    BadRequest:
      description: Corpo, parâmetro ou identificador inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: Dados da requisição inválidos.
    Unauthorized:
      description: Token ausente, inválido, expirado ou usuário inativo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: Autenticação necessária.
    Forbidden:
      description: Perfil RBAC sem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: 'Acesso negado: perfil de usuário não autorizado para esta operação.'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: Veículo não encontrado.
    Conflict:
      description: Conflito de placa ou de revisão concorrente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: O veículo foi alterado por outra operação. Atualize os dados e tente novamente.
    UnprocessableEntity:
      description: Transição de situação não permitida pela máquina de estados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: Transição de INACTIVE para IN_MAINTENANCE não permitida.
    InternalError:
      description: Erro interno inesperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            erro: Erro interno do servidor.
  schemas:
    ErrorResponse:
      type: object
      required:
        - erro
      properties:
        erro:
          type: string
          description: Mensagem orientadora em português.
          example: Veículo não encontrado.
    UserRole:
      type: string
      description: Perfil de acesso canônico do sistema.
      enum:
        - ADMINISTRADOR
        - GESTOR
        - SOLICITANTE
        - MOTORISTA
        - ATENDENTE_SVO
        - EQUIPE_SVO
    LoginRequest:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
          description: E-mail institucional do usuário.
          example: admin@example.test
        senha:
          type: string
          format: password
          minLength: 1
          description: Senha em texto puro; o backend compara com o hash bcrypt.
          example: senha-ficticia-123
    LoginSuccess:
      type: object
      required:
        - token
        - nome
        - perfil
      properties:
        token:
          type: string
          description: Token JWT assinado com HS256.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.exemplo.ficticio
        nome:
          type: string
          description: Nome de exibição do usuário.
          example: Administrador de Teste
        perfil:
          $ref: '#/components/schemas/UserRole'
    Role:
      type: object
      required:
        - id
        - name
        - description
        - createdAt
      properties:
        id:
          type: string
          example: '1'
        name:
          $ref: '#/components/schemas/UserRole'
        description:
          type: string
          nullable: true
          example: Gestão operacional de frotas e aprovação de viagens FSPH
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00.000Z'
    VehicleCategory:
      type: string
      description: Categoria operacional do veículo.
      enum:
        - PASSENGER
        - BODY
        - OTHER
    VehicleStatus:
      type: string
      description: Situação vigente do veículo.
      enum:
        - AVAILABLE
        - IN_MAINTENANCE
        - INACTIVE
    VehicleOperationType:
      type: string
      description: Operação atendida pelo veículo.
      enum:
        - ADMINISTRATIVE
        - SVO
    Vehicle:
      type: object
      required:
        - id
        - licensePlate
        - categories
        - seats
        - bodyLimit
        - weightLimit
        - operationType
        - status
        - revision
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Identificador numérico serializado como texto.
          example: '1'
        licensePlate:
          type: string
          description: Placa normalizada em maiúsculas.
          example: ABC1D23
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VehicleCategory'
        seats:
          type: integer
          minimum: 0
          example: 5
        bodyLimit:
          type: integer
          minimum: 0
          example: 2
        weightLimit:
          type: number
          minimum: 0
          nullable: true
          description: Limite de peso em quilogramas; pode ser nulo.
          example: 450.5
        operationType:
          $ref: '#/components/schemas/VehicleOperationType'
        status:
          $ref: '#/components/schemas/VehicleStatus'
        revision:
          type: integer
          minimum: 1
          description: Revisão otimista, incrementada a cada alteração.
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00.000Z'
    ChangeMetadata:
      type: object
      required:
        - reportedBy
        - reason
      properties:
        reportedBy:
          type: string
          minLength: 1
          description: Identificação de quem reportou a alteração.
          example: Maria Teste
        reason:
          type: string
          minLength: 1
          description: Justificativa da alteração para a trilha de auditoria.
          example: Cadastro inicial para testes
    VehicleAttributes:
      type: object
      required:
        - licensePlate
        - categories
        - seats
        - bodyLimit
        - weightLimit
        - operationType
      properties:
        licensePlate:
          type: string
          pattern: '^(?:[A-Z]{3}[0-9]{4}|[A-Z]{3}[0-9][A-Z][0-9]{2})$'
          description: Placa no formato ABC1234 ou ABC1D23.
          example: ABC1D23
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VehicleCategory'
        seats:
          type: integer
          minimum: 0
          example: 5
        bodyLimit:
          type: integer
          minimum: 0
          example: 2
        weightLimit:
          type: number
          minimum: 0
          nullable: true
          description: Limite de peso em quilogramas; envie null quando não houver.
          example: 450.5
        operationType:
          $ref: '#/components/schemas/VehicleOperationType'
    CreateVehicleInput:
      allOf:
        - $ref: '#/components/schemas/VehicleAttributes'
        - $ref: '#/components/schemas/ChangeMetadata'
    UpdateVehicleInput:
      allOf:
        - $ref: '#/components/schemas/VehicleAttributes'
        - $ref: '#/components/schemas/ChangeMetadata'
        - type: object
          required:
            - expectedRevision
          properties:
            expectedRevision:
              type: integer
              minimum: 1
              description: Revisão recebida no último carregamento.
              example: 1
    ChangeVehicleStatusInput:
      allOf:
        - $ref: '#/components/schemas/ChangeMetadata'
        - type: object
          required:
            - status
            - expectedRevision
          properties:
            status:
              $ref: '#/components/schemas/VehicleStatus'
            expectedRevision:
              type: integer
              minimum: 1
              description: Revisão recebida no último carregamento.
              example: 1
